[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intent-harness"
version = "0.1.0"
description = "Answer visual questions by routing them to measurement tools."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.3",
    "scipy==1.18.1",
    "pillow==12.3.0",
    "python-dotenv==1.2.4",
]

[project.optional-dependencies]
models = [
    "torch==2.13.0",
    "transformers==5.16.1",
    "accelerate==1.14.0",
]
test = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
include = ["intent_harness*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.package-data]
intent_harness_quantity = ["*.npz"]
